<app-section sectionId="about" eyebrow="About" heading="About me">
  @if (profile(); as p) {
    @for (para of p.longIntroduction; track $index) {
      <p class="about__bio">{{ para }}</p>
    }
  }

  @if (skills().length) {
    <div class="about__skills">
      <h3 class="about__skills-title">Skills</h3>
      <div class="about__groups">
        @for (group of skills(); track group.category) {
          <div class="about__group">
            <h4 class="about__category">{{ group.category }}</h4>
            <ul class="about__items" [attr.aria-label]="group.category + ' skills'">
              @for (item of group.items; track item) {
                <li>
                  <app-badge>{{ item }}</app-badge>
                </li>
              }
            </ul>
          </div>
        }
      </div>
    </div>
  }
</app-section>
