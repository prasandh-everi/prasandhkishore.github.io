<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio — Senior Software Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Senior Software Engineer portfolio — experience, projects, and skills."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
    Anti-flash theme bootstrap.
    Runs synchronously BEFORE first paint so the correct theme is applied
    immediately, avoiding a flash of the wrong theme while Angular boots.
    Mirrors the logic in ThemeService (localStorage key + system fallback).
  -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <app-root></app-root>
  </body>
</html>
